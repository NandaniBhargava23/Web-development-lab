<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold">Foodie</a>
            <span class="text-white">Cart: <b id="cart">0</b></span>
        </div>
    </nav>

    <section class="hero text-center">
        <h1>Delicious Food</h1>
        <p>Fresh food delivered to your doorstep</p>
        <button class="btn btn-danger">Order Now</button>
    </section>

    <div class="container my-5">
        <h2 class="text-center mb-4">Popular Food</h2>
        <div class="row g-4">
            <div class="col-lg-4 col-md-6 col-12">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" class="card-img-top" alt="Pizza">
                    <div class="card-body text-center">
                        <h4>Pizza</h4>
                        <p>₹ 249</p>
                        <button class="btn btn-danger" onclick="addCart()">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 col-12">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" class="card-img-top" alt="Burger">
                    <div class="card-body text-center">
                        <h4>Burger</h4>
                        <p>₹ 149</p>
                        <button class="btn btn-danger" onclick="addCart()">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 col-12">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1621996346565-e3d5d6281286?w=500" class="card-img-top" alt="Pasta">
                    <div class="card-body text-center">
                        <h4>Pasta</h4>
                        <p>₹ 199</p>
                        <button class="btn btn-danger" onclick="addCart()">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Foodie | Student Developer</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
